[package]
name = "reco"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
lambda_http = "1.3.2"
pgvector = { version = "0.4.2", features = ["sqlx"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "tls-rustls"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

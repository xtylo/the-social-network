services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: tsn-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tsn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tsn}
      POSTGRES_DB: ${POSTGRES_DB:-tsn}
    # extra memory so building the HNSW index (day 7) does not slow down
    command: ["postgres", "-c", "maintenance_work_mem=256MB"]
    # Parallel index builds share memory through /dev/shm, which Docker limits to 64 MB by default.
    # It must be larger than maintenance_work_mem, or CREATE INDEX fails with "No space left on device".
    shm_size: 512mb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro   # 01_schema.sql and 02_seed.sql only run when the volume is empty
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tsn} -d ${POSTGRES_DB:-tsn}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3 emulator, no account or token required (MIT): https://github.com/hectorvent/floci
  # Alternative: LocalStack (requires LOCALSTACK_AUTH_TOKEN since March 2026), same port 4566.
  floci:
    image: hectorvent/floci:latest
    container_name: tsn-floci
    ports:
      - "4566:4566"

volumes:
  pgdata:
